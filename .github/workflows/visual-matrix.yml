name: Visual matrix

# The screenshot matrix in e2e/rbac-visual.test.ts: 68 surfaces at two colour
# schemes, two widths and two text sizes, plus the interactive state walks. It
# takes about 22 minutes and its images only earn their keep when someone
# reviews them, so it is not part of the CI gate. Run it from the Actions tab
# when a change touches the admin, reading, access or platform surfaces; the
# captures and their metrics are kept as a workflow artefact.
on:
  workflow_dispatch:

jobs:
  matrix:
    name: Screenshot matrix
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install build tooling
        # Pinned to match ci.yml, deploy.yml and the Dockerfile - bump together.
        env:
          ESBUILD_VERSION: 0.28.2
          TAILWINDCSS_VERSION: 4.3.3
        run: |
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWINDCSS_VERSION}/tailwindcss-linux-x64" \
            -o /usr/local/bin/tailwindcss
          chmod +x /usr/local/bin/tailwindcss
          { curl -fsSL --retry 3 --retry-all-errors \
              "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-${ESBUILD_VERSION}.tgz" \
              -o /tmp/esbuild.tgz \
            && tar -xzf /tmp/esbuild.tgz -C /tmp \
            && sudo mv /tmp/package/bin/esbuild /usr/local/bin/esbuild ; } \
          || curl -fsSL --retry 3 --retry-all-errors \
              "https://unpkg.com/@esbuild/linux-x64@${ESBUILD_VERSION}/bin/esbuild" \
              -o /usr/local/bin/esbuild
          sudo chmod +x /usr/local/bin/esbuild

      - name: Cache Chromium (astral/e2e)
        uses: actions/cache@v4
        with:
          path: ~/.cache/astral
          key: astral-chromium-${{ runner.os }}-${{ hashFiles('deno.json') }}

      - name: Screenshot matrix
        env:
          ASTRAL_BIN_ARGS: --no-sandbox
        run: deno task test:e2e:visual

      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-matrix-${{ github.sha }}
          path: .planning/logs
          if-no-files-found: warn
          retention-days: 14

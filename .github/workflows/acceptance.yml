name: Live acceptance sweep

on:
  schedule:
    # Avoid the top of the hour, when scheduled Actions are most likely to queue.
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-acceptance-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Check live demo public endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Functional testing belongs to the demo corpus, never a customer portal.
      # Scheduled and manual dispatches deliberately share the same fixed target.
      ACCEPTANCE_TENANTS: demo
      ACCEPTANCE_BASE_URL: https://demo.corpuskit.org
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Sweep live demo tenant
        run: deno run --allow-net --allow-env=ACCEPTANCE_TENANTS,ACCEPTANCE_BASE_URL apps/api/scripts/live-acceptance.ts

name: Gate and deploy CorpusKit

# Production release pattern: repository changes pass the complete gate,
# then a pinned Wrangler deploy publishes the Worker and static assets. Runtime
# ARAG and Entra secrets remain attached to the Cloudflare Worker and are never
# copied through GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-corpuskit-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Typecheck, lint, format, tests, build
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.creds.outputs.deployable }}
    steps:
      - name: Check Cloudflare deployment credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          # The lock-verified DENO_DIR cache described in ci.yml.
          cache: true

      - name: Install build tooling
        env:
          ESBUILD_VERSION: 0.28.2
          TAILWINDCSS_VERSION: 4.3.3
        run: |
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWINDCSS_VERSION}/tailwindcss-linux-x64" \
            -o /usr/local/bin/tailwindcss
          chmod +x /usr/local/bin/tailwindcss
          { curl -fsSL --retry 3 --retry-all-errors \
              "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-${ESBUILD_VERSION}.tgz" \
              -o /tmp/esbuild.tgz \
            && tar -xzf /tmp/esbuild.tgz -C /tmp \
            && sudo mv /tmp/package/bin/esbuild /usr/local/bin/esbuild ; } \
          || curl -fsSL --retry 3 --retry-all-errors \
              "https://unpkg.com/@esbuild/linux-x64@${ESBUILD_VERSION}/bin/esbuild" \
              -o /usr/local/bin/esbuild
          sudo chmod +x /usr/local/bin/esbuild

      - name: Build production package
        run: deno task build:cloudflare

      - name: Gate
        run: deno task check

      - name: Validate Wrangler package
        run: npx -y wrangler@4.127.1 deploy --config wrangler.jsonc --dry-run

      - name: Preserve deployment package
        uses: actions/upload-artifact@v4
        with:
          name: corpuskit-cloudflare-${{ github.sha }}
          if-no-files-found: error
          retention-days: 2
          path: |
            apps/web/dist
            dist/cloudflare/worker.js

  e2e:
    # The browser E2E suite in parallel shards, as in ci.yml. Nothing deploys
    # until every shard passes: deploy-demo needs this job and production
    # needs deploy-demo.
    name: Browser E2E persona journeys (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The only matrix dimension, so strategy.job-total is the shard count.
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install build tooling
        env:
          ESBUILD_VERSION: 0.28.2
          TAILWINDCSS_VERSION: 4.3.3
        run: |
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWINDCSS_VERSION}/tailwindcss-linux-x64" \
            -o /usr/local/bin/tailwindcss
          chmod +x /usr/local/bin/tailwindcss
          { curl -fsSL --retry 3 --retry-all-errors \
              "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-${ESBUILD_VERSION}.tgz" \
              -o /tmp/esbuild.tgz \
            && tar -xzf /tmp/esbuild.tgz -C /tmp \
            && sudo mv /tmp/package/bin/esbuild /usr/local/bin/esbuild ; } \
          || curl -fsSL --retry 3 --retry-all-errors \
              "https://unpkg.com/@esbuild/linux-x64@${ESBUILD_VERSION}/bin/esbuild" \
              -o /usr/local/bin/esbuild
          sudo chmod +x /usr/local/bin/esbuild

      - name: Cache Chromium (astral/e2e)
        uses: actions/cache@v4
        with:
          path: ~/.cache/astral
          key: astral-chromium-${{ runner.os }}-${{ hashFiles('deno.json') }}

      - name: Browser E2E persona journeys
        # The 22-minute screenshot matrix in e2e/rbac-visual.test.ts is opt-in
        # (E2E_VISUAL_MATRIX=1) and runs from visual-matrix.yml on demand.
        env:
          # GitHub-hosted runners do not expose Chromium's setuid sandbox.
          # Astral appends this to the browser process it launches in CI.
          ASTRAL_BIN_ARGS: --no-sandbox
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        # test:e2e ignoring the other shards' files; see ci.yml.
        run: |
          ignore=$(deno run --allow-read=e2e e2e/support/shard.ts ignore "$SHARD" "$SHARDS")
          deno task test:e2e "--ignore=$ignore"

  deploy:
    name: Deploy to Cloudflare Workers
    # The documentation demo exercises the real ARAG protocol before production changes.
    needs: [gate, deploy-demo]
    if: needs.gate.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: corpuskit-cloudflare-${{ github.sha }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Record exact previous production version
        run: deno run --allow-env --allow-run=npx --allow-write "$GITHUB_WORKSPACE/apps/cloudflare/scripts/release-safety.ts" capture corpuskit "$RUNNER_TEMP/production-before.json"

      - name: Deploy the tested package
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.127.1
          command: deploy --config wrangler.jsonc

      - name: Record candidate production version
        id: candidate
        env:
          WRANGLER_PUBLISH_OUTPUT: ${{ steps.publish.outputs['command-output'] }}
        run: deno run --allow-env --allow-run=npx --allow-write apps/cloudflare/scripts/release-safety.ts capture-candidate corpuskit "$RUNNER_TEMP/production-candidate.json"

      - name: Verify the live Worker
        run: deno run --allow-env --allow-read --allow-net apps/cloudflare/scripts/release-safety.ts verify corpuskit "$RUNNER_TEMP/production-candidate.json"

      - name: Verify Microsoft sign-in is configured
        if: vars.CORPUSKIT_RUNTIME_CONFIGURED == 'true'
        env:
          BASE_URL: https://corpuskit.org
        run: |
          curl --fail --silent --show-error --retry 3 \
            "$BASE_URL/auth/me" | grep '"authenticated":false'

      - name: Verify portal custom domains
        # The hostnames come from wrangler.jsonc, the same list the deploy attaches, so a
        # domain removed from the config is not still expected here.
        run: |
          hosts=$(grep -o '"pattern": *"[^"]*"' wrangler.jsonc | sed 's/.*: *"//; s/"$//')
          test -n "$hosts"
          for host in $hosts; do
            echo "checking https://$host/api/health"
            curl --fail --silent --show-error --retry 8 --retry-delay 5 \
              --output /dev/null "https://$host/api/health"
          done

      - name: Restore exact previous production version after verification failure
        id: rollback
        if: failure() && steps.publish.outcome == 'success' && steps.candidate.outcome == 'success'
        run: deno run --allow-env --allow-read --allow-run=npx apps/cloudflare/scripts/release-safety.ts rollback corpuskit "$RUNNER_TEMP/production-before.json" "$RUNNER_TEMP/production-candidate.json"

      - name: Verify restored production version, sign-in and domains
        if: failure() && steps.rollback.outcome == 'success'
        env:
          BASE_URL: https://corpuskit.org
          RUNTIME_CONFIGURED: ${{ vars.CORPUSKIT_RUNTIME_CONFIGURED }}
        run: |
          deno run --allow-env --allow-read --allow-net apps/cloudflare/scripts/release-safety.ts verify corpuskit "$RUNNER_TEMP/production-before.json"
          if [ "$RUNTIME_CONFIGURED" = true ]; then
            curl --fail --silent --show-error --retry 3 \
              "$BASE_URL/auth/me" | grep '"authenticated":false'
          fi
          hosts=$(grep -o '"pattern": *"[^"]*"' wrangler.jsonc | sed 's/.*: *"//; s/"$//')
          test -n "$hosts"
          for host in $hosts; do
            echo "checking restored https://$host/api/health"
            curl --fail --silent --show-error --retry 8 --retry-delay 5 \
              --output /dev/null "https://$host/api/health"
          done

  deploy-demo:
    name: Deploy documentation demo
    needs: [gate, e2e]
    if: needs.gate.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: corpuskit-cloudflare-${{ github.sha }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Record exact previous demo version
        run: deno run --allow-env --allow-run=npx --allow-write apps/cloudflare/scripts/release-safety.ts capture corpuskit-demo "$RUNNER_TEMP/demo-before.json"
      - name: Deploy the tested demo package
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.127.1
          command: deploy --config wrangler.demo.jsonc
      - name: Record candidate demo version
        id: candidate
        env:
          WRANGLER_PUBLISH_OUTPUT: ${{ steps.publish.outputs['command-output'] }}
        run: deno run --allow-env --allow-run=npx --allow-write apps/cloudflare/scripts/release-safety.ts capture-candidate corpuskit-demo "$RUNNER_TEMP/demo-candidate.json"
      - name: Verify demo health
        run: deno run --allow-env --allow-read --allow-net apps/cloudflare/scripts/release-safety.ts verify corpuskit-demo "$RUNNER_TEMP/demo-candidate.json"
      - name: Verify real demo search, cited answer and refusal before production
        env:
          BASE_URL: https://demo.corpuskit.org
          PERSONA_SMOKE_TENANTS: demo
        run: deno run --allow-net --allow-env apps/api/scripts/persona-smoke.ts --quick
      - name: Restore exact previous demo version after verification failure
        id: rollback
        if: failure() && steps.publish.outcome == 'success' && steps.candidate.outcome == 'success'
        run: deno run --allow-env --allow-read --allow-run=npx apps/cloudflare/scripts/release-safety.ts rollback corpuskit-demo "$RUNNER_TEMP/demo-before.json" "$RUNNER_TEMP/demo-candidate.json"
      - name: Verify restored demo version and live journey
        if: failure() && steps.rollback.outcome == 'success'
        env:
          BASE_URL: https://demo.corpuskit.org
          PERSONA_SMOKE_TENANTS: demo
        run: |
          deno run --allow-env --allow-read --allow-net apps/cloudflare/scripts/release-safety.ts verify corpuskit-demo "$RUNNER_TEMP/demo-before.json"
          deno run --allow-net --allow-env apps/api/scripts/persona-smoke.ts --quick

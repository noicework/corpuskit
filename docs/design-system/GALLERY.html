<title>Design system gallery</title>
<style>
:root { --bg:#f7f7f5; --surface:#fff; --ink:#1a1815; --ink2:#5b5851; --line:#d2d0c9; --accent:#155da6; }
@media (prefers-color-scheme: dark) { :root { --bg:#121316; --surface:#1a1c20; --ink:#f2f3f5; --ink2:#cfd2d8; --line:#33373e; --accent:#8fc0ee; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 16px; }
h1 { margin: 0 0 4px; font-size: 20px; }
header p { margin: 0 0 10px; color: var(--ink2); font-size: 13px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.filters label { font-size: 13px; color: var(--ink2); display: inline-flex; gap: 6px; align-items: center; }
select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); min-height: 36px; }
main { padding: 16px; display: grid; gap: 24px; }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
section h2 { margin: 0 0 8px; font-size: 15px; }
section h2 span { color: var(--ink2); font-weight: 400; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pair.narrow { grid-template-columns: repeat(2, minmax(0, 300px)); }
figure { margin: 0; }
figcaption { font-size: 12px; color: var(--ink2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .06em; }
img { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 6px; }
.empty { color: var(--ink2); font-size: 13px; padding: 24px 0; }
@media (max-width: 700px) { .pair, .pair.narrow { grid-template-columns: 1fr; } }
</style>
</head>
